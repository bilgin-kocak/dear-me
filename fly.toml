# Fly.io settings. `fly launch` offers to copy this file: say yes, then pick your own app name.
app = "dear-me-goa"
primary_region = "sin" # Singapore, the closest region to Goa that Fly offers

[env]
  PORT = "3000"
  DB_PATH = "/data/dear-me.db"

[http_service]
  internal_port = 3000
  force_https = true
  # The bot long-polls Telegram from inside the Machine, and Fly never counts that as
  # traffic. With Fly's default auto-stop the Machine would sleep and residents' messages
  # would go unanswered, so it stays on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "data"
  destination = "/data"
